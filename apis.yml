name: Privado
description: >-
  Privado (Privado.ai) is a privacy engineering and data-privacy compliance
  company that helps engineering and privacy teams build privacy-first
  products. Its flagship is an open-source static code-analysis scanner that
  detects personal-data flows in source code, finds data-security violations,
  and generates compliance artifacts such as RoPA and Google Play Store Data
  Safety reports. The scanner runs locally or in CI/CD (Docker-based) via the
  Privado CLI, and results can optionally sync to the Privado Cloud dashboard
  where products like Wren (an AI privacy analyst), Agentic Assessments,
  Dynamic Data Maps, Web Auditor, and App Auditor automate data mapping and
  privacy impact assessments. Privado is a DevSecOps / privacy-governance tool
  rather than a public REST API provider; its developer surface is the
  open-source scanner, the CLI, and the docs at docs.privado.ai. Backed by
  Insight Partners.
